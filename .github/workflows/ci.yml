name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  mcp-build-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Final line of defense. The local pre-commit guard (.githooks/pre-commit, wired up by the
      # npm `prepare` script) is what normally keeps this green; this job stays because a hook can
      # always be bypassed with --no-verify or skipped on a machine that never ran npm install.
      - name: Ensure dist/mcp-server.mjs matches source (npm run build:mcp if this fails)
        run: npm run check:mcp-bundle
      - name: Ensure the rebuild is byte-stable in a clean checkout
        run: |
          npm run build:mcp
          git diff --exit-code dist/mcp-server.mjs

  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:pi
      # Drift guards: the prompt copies and the two project-context implementations are only
      # "in sync" if something fails when they are not.
      - run: npm run eval:prompt-sync
      - run: npm run eval:project-context
      - run: npm run eval:standing-rules
      - run: npm run eval:project-digest
      - run: npm run eval:inject-env
      - run: npm run eval:session-inject
      - run: npm run eval:review-format
      - run: npm run eval:trace-builder
      - run: npm run eval:trace-sensitive
      - run: npm run eval:sensitive-pattern
      - run: npm run eval:correction-signal
      - run: npm run eval:throttle-state
      - run: npm run eval:candidate-fields
      - run: npm run eval:lifecycle
      - run: npm run eval:purge-scrub
      - run: npm run eval:memory-get
      - run: npm run eval:review-park
      - run: npm run eval:bundle-guard

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ignored private files are not tracked
        run: |
          test -z "$(git ls-files wrangler.jsonc PLAN.md .dev.vars .env 2>/dev/null)"
      - name: Scan for local/private deployment markers
        run: |
          ! git grep -nE 'wangyao|zz-b236|/Users/|636eb468' -- ':!package-lock.json' ':!.github/workflows/ci.yml'
